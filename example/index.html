<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hawkes Analytics demo</title>
  <!-- The one line a page needs. No data-product here, so nothing is sent: debug mode shows what would go out. -->
  <script src="https://hawkesgen.ai/sdk/analytics@1.js" data-debug="1" defer></script>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1b1b1b; --muted: #666; --card: #fff; --line: #ddd; --accent: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #eee; --muted: #aaa; --card: #1d1d1d; --line: #333; --accent: #ff8a80; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p { color: var(--muted); margin: 0 0 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 50vh; font-size: 13px; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>Hawkes Analytics</h1>
  <p>Each button calls the SDK the way a game would. In debug mode with no product, events stay on this page.
     SDK: <span id="status">loading…</span></p>
  <div class="row">
    <button data-call="ready">ready()</button>
    <button data-call="levelStart">levelStart(1)</button>
    <button data-call="death">death('spikes')</button>
    <button data-call="levelEnd">levelEnd(1, 'complete')</button>
    <button data-call="track">track('demo_click')</button>
    <button data-call="ask">ask()</button>
  </div>
  <pre id="log">No events yet.</pre>
</main>
<script>
  // Calls made before the SDK arrives wait here and are played back (the same queue the npm package and Unity use).
  window.hawkesAnalyticsQ = window.hawkesAnalyticsQ || [];
  const a = (m, ...args) => window.hawkesAnalytics && window.hawkesAnalytics.version ? window.hawkesAnalytics[m](...args) : window.hawkesAnalyticsQ.push([m, ...args]);
  const calls = {
    ready: () => a('ready'),
    levelStart: () => a('levelStart', 1),
    death: () => a('death', 'spikes', { where: 'demo' }),
    levelEnd: () => a('levelEnd', 1, 'complete', { score: 10 }),
    track: () => a('track', 'demo_click', { at: Date.now() }),
    ask: () => a('ask', { id: 'demo-' + Date.now(), question: 'How is the demo?', kind: 'stars', comment: true }),
  };
  document.querySelectorAll('[data-call]').forEach((b) => b.addEventListener('click', () => { calls[b.dataset.call](); setTimeout(show, 50); }));
  function show() {
    const h = window.hawkesAnalytics;
    document.getElementById('status').textContent = h && h.version ? 'v' + h.version + (h.config().product ? '' : ' (no product: nothing sent)') : 'not loaded (blocked or offline)';
    const log = h && h.debugLog ? h.debugLog.slice(-30).map((e) => e.name + ' ' + JSON.stringify(e.props || {})).join('\n') : '';
    document.getElementById('log').textContent = log || 'No events yet.';
  }
  window.addEventListener('load', show);
  setInterval(show, 2000);
</script>
</body>
</html>
